name: Android Build

on:
  workflow_dispatch:
   
      
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: true

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;25.1.8937393"

    - name: Install CMake
      run: |
        sdkmanager --install "cmake;3.31.1"

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew clean :fusionApp:assembleDebug -Pandroid.ndkVersion=25.1.8937393
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
          name: fusionApp-debug
          path: fusionApp/build/outputs/apk/debug/fusionApp-debug.apk
          
